name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  desktop:
    name: CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cross-compile
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2" ext="$3"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/iprocker-$goos-$goarch$ext" ./cmd/iprocker
          }
          build linux amd64 ""
          build linux arm64 ""
          build linux arm ""
          build darwin amd64 ""
          build darwin arm64 ""
          build windows amd64 ".exe"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/*

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018" > /dev/null

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/v}"
          fi
          # versionCode must increase monotonically, so derive it from semver.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          MAJOR=${MAJOR:-1}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "ANDROID_VERSION_NAME=$TAG" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_ENV"

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # When no keystore secret is configured the build still produces an
          # installable APK signed with the debug key, so a release is never
          # blocked on signing setup.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret found; falling back to debug signing." >&2
            exit 0
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/release.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build Go core into an AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          IPROCKER_VERSION: ${{ steps.v.outputs.version }}
        run: |
          chmod +x android/build_aar.sh
          ./android/build_aar.sh

      - name: Assemble release APKs
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p release-artifacts
          V="${{ steps.v.outputs.version }}"
          SUFFIX=""
          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
            SUFFIX="-debugsigned"
          fi
          for apk in android/app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk")
            abi=$(echo "$name" | sed -E 's/^app-(.*)-release(-unsigned)?\.apk$/\1/')
            [ "$abi" = "$name" ] && abi="universal"
            cp "$apk" "release-artifacts/IP-ROCKER-${V}-${abi}${SUFFIX}.apk"
          done
          (cd release-artifacts && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-artifacts/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p upload
          find artifacts -type f -exec cp {} upload/ \;
          ls -lh upload

      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
